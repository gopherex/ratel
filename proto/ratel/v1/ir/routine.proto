syntax = "proto3";

package ratel.v1.ir;

import "ratel/v1/ir/common.proto";
import "ratel/v1/ir/expr.proto";
import "ratel/v1/ir/schema.proto";
import "ratel/v1/ir/type.proto";

option go_package = "github.com/gopherex/ratel/ir;ir";

// User-defined types, views, functions, procedures and triggers.

message EnumType {
  QualifiedName name = 1;
  repeated string labels = 2;  // ordered by sort order
  Metadata meta = 3;
}

message DomainConstraint {
  string name = 1;
  Expr check = 2;
  Metadata meta = 3;
}

message DomainType {
  QualifiedName name = 1;
  TypeRef base_type = 2;
  bool nullable = 3;      // false = NOT NULL
  Expr default_expr = 4;
  string collation = 5;
  repeated DomainConstraint constraints = 6;  // ordered by object id
  Metadata meta = 7;
}

message CompositeField {
  string name = 1;
  TypeRef type = 2;
  string collation = 3;
  Metadata meta = 4;
}

message CompositeType {
  QualifiedName name = 1;
  repeated CompositeField fields = 2;  // ordered by attribute position
  Metadata meta = 3;
}

message RangeType {
  QualifiedName name = 1;
  TypeRef subtype = 2;
  string subtype_opclass = 3;
  string collation = 4;
  string canonical = 5;     // canonical function name
  string subtype_diff = 6;  // subtype_diff function name
  string multirange = 7;    // associated multirange type name
  Metadata meta = 8;
}

enum CheckOption {
  CHECK_OPTION_UNSPECIFIED = 0; // no WITH CHECK OPTION
  CHECK_OPTION_LOCAL = 1;
  CHECK_OPTION_CASCADED = 2;
}

message View {
  QualifiedName name = 1;
  repeated string columns = 2;  // explicit column list, when one was given
  SelectStmt query = 3;
  CheckOption check_option = 4;
  bool security_barrier = 5;
  Metadata meta = 6;
}

message MaterializedView {
  QualifiedName name = 1;
  repeated string columns = 2;
  SelectStmt query = 3;
  bool with_data = 4;         // WITH DATA vs WITH NO DATA
  repeated Index indexes = 5; // ordered by object id
  string tablespace = 6;
  Metadata meta = 7;
}

enum ArgMode {
  ARG_MODE_UNSPECIFIED = 0; // IN (default)
  ARG_MODE_IN = 1;
  ARG_MODE_OUT = 2;
  ARG_MODE_INOUT = 3;
  ARG_MODE_VARIADIC = 4;
}

message Argument {
  string name = 1;  // empty for positional-only parameters
  TypeRef type = 2;
  ArgMode mode = 3;
  Expr default_value = 4;  // DEFAULT expr
}

message SetofType {
  TypeRef type = 1;  // RETURNS SETOF <type>
}

message TableColumn {
  string name = 1;
  TypeRef type = 2;
}

message TableReturn {
  repeated TableColumn columns = 1;  // RETURNS TABLE(col type, ...)
}

message ReturnType {
  oneof kind {
    TypeRef scalar = 1;
    SetofType setof = 2;
    TableReturn table = 3;
    bool void_value = 4;    // RETURNS void
    bool trigger_value = 5; // RETURNS trigger
  }
}

enum Volatility {
  VOLATILITY_UNSPECIFIED = 0; // VOLATILE (default)
  VOLATILITY_VOLATILE = 1;
  VOLATILITY_STABLE = 2;
  VOLATILITY_IMMUTABLE = 3;
}

enum ParallelSafety {
  PARALLEL_SAFETY_UNSPECIFIED = 0; // UNSAFE (default)
  PARALLEL_SAFETY_UNSAFE = 1;
  PARALLEL_SAFETY_RESTRICTED = 2;
  PARALLEL_SAFETY_SAFE = 3;
}

enum NullInputBehavior {
  NULL_INPUT_BEHAVIOR_UNSPECIFIED = 0; // CALLED ON NULL INPUT (default)
  NULL_INPUT_BEHAVIOR_CALLED = 1;
  NULL_INPUT_BEHAVIOR_STRICT = 2;      // RETURNS NULL ON NULL INPUT
}

message Function {
  QualifiedName name = 1;  // last part is the argument type list
  repeated Argument arguments = 2;
  ReturnType returns = 3;
  string language = 4;  // sql, plpgsql, c...
  Volatility volatility = 5;
  NullInputBehavior null_input = 6;
  bool security_definer = 7;  // false = SECURITY INVOKER
  bool leakproof = 8;
  ParallelSafety parallel = 9;
  int32 estimated_cost = 10;
  int32 estimated_rows = 11;
  string body = 12;                  // routine body source (AS '...')
  repeated SelectStmt sql_body = 13; // standard SQL body (BEGIN ATOMIC ...)
  Metadata meta = 14;
  string routine_kind = 15; // pg_proc.prokind: f (function), a (aggregate), w (window)
  uint32 default_arguments = 16; // number of trailing input arguments with defaults
  TypeRef variadic_element = 17; // pg_proc.provariadic; argument itself keeps its declared type
  AggregateSignature aggregate = 18; // present only for aggregate functions
}

// AggregateSignature preserves the calling convention of pg_aggregate.
message AggregateSignature {
  string kind = 1; // n (normal), o (ordered-set), h (hypothetical-set)
  uint32 direct_arguments = 2;
}

message Procedure {
  QualifiedName name = 1;  // last part is the argument type list
  repeated Argument arguments = 2;
  string language = 3;
  bool security_definer = 4;  // false = SECURITY INVOKER
  string body = 5;
  repeated SelectStmt sql_body = 6;  // standard SQL body (BEGIN ATOMIC ...)
  Metadata meta = 7;
}

enum TriggerTiming {
  TRIGGER_TIMING_UNSPECIFIED = 0;
  TRIGGER_TIMING_BEFORE = 1;
  TRIGGER_TIMING_AFTER = 2;
  TRIGGER_TIMING_INSTEAD_OF = 3;
}

enum TriggerEvent {
  TRIGGER_EVENT_UNSPECIFIED = 0;
  TRIGGER_EVENT_INSERT = 1;
  TRIGGER_EVENT_UPDATE = 2;
  TRIGGER_EVENT_DELETE = 3;
  TRIGGER_EVENT_TRUNCATE = 4;
}

enum TriggerLevel {
  TRIGGER_LEVEL_UNSPECIFIED = 0;
  TRIGGER_LEVEL_ROW = 1;       // FOR EACH ROW
  TRIGGER_LEVEL_STATEMENT = 2; // FOR EACH STATEMENT
}

message Trigger {
  string name = 1;
  ObjectRef table = 2;  // table the trigger is attached to
  TriggerTiming timing = 3;
  repeated TriggerEvent events = 4;
  repeated string update_columns = 5;  // UPDATE OF col, ...
  TriggerLevel level = 6;
  bool constraint = 7;    // CONSTRAINT TRIGGER
  Expr when = 8;          // WHEN (condition)
  ObjectRef function = 9; // EXECUTE FUNCTION ...
  repeated string arguments = 10;
  Metadata meta = 11;
}
