syntax = "proto3";

package ratel.v1.ir;

import "ratel/v1/ir/common.proto";
import "ratel/v1/ir/relation.proto";
import "ratel/v1/ir/routine.proto";
import "ratel/v1/ir/schema.proto";
import "ratel/v1/ir/type.proto";

option go_package = "github.com/gopherex/ratel/pkg/ir;ir";

// The database snapshot: schemas with their objects, database-wide
// extensions, and the relation graph.

// Extension is an installed database extension. Extensions are database-wide
// objects; the schema is where their objects are installed. The object id of
// an extension is the extension name alone.
message Extension {
  string name = 1;    // e.g. "pgcrypto"; unique within the database
  string schema = 2;  // schema the extension's objects are installed in
  string version = 3; // installed version, e.g. "1.5"
  Metadata meta = 4;
}

// Schema is a PostgreSQL namespace and the container for its objects.
message Schema {
  string name = 1;
  string owner = 2;  // owning role; roles are referenced by name, not modeled
  repeated Table tables = 3;                     // ordered by object id
  repeated View views = 4;                       // ordered by object id
  repeated MaterializedView materialized_views = 5;
  repeated Sequence sequences = 6;
  repeated Function functions = 7;
  repeated Procedure procedures = 8;
  repeated Trigger triggers = 9;  // resolved targets of Table.triggers
  repeated EnumType enums = 10;
  repeated DomainType domains = 11;
  repeated CompositeType composites = 12;
  repeated RangeType ranges = 13;
  repeated Grant grants = 14;  // grants on objects of this schema
  Metadata meta = 15;
  repeated BuiltinType builtin_types = 16;
  repeated BuiltinOperator builtin_operators = 17;
  repeated BuiltinCast builtin_casts = 18;
}

// BuiltinType preserves pg_type's overload-resolution metadata without OIDs.
message BuiltinType {
  TypeRef type = 1;
  string category = 2; // pg_type.typcategory
  bool preferred = 3;
  TypeRef base = 4; // domain base, when present
  TypeRef range_subtype = 5; // range or multirange subtype
}

// BuiltinOperator identifies unary/binary operators by their operand types.
message BuiltinOperator {
  string name = 1;
  TypeRef left = 2; // absent for prefix operators
  TypeRef right = 3;
  TypeRef result = 4;
  QualifiedName function = 5; // implementing function's input signature
}

// BuiltinCast contains implicit and assignment casts, never explicit-only casts.
message BuiltinCast {
  TypeRef source = 1;
  TypeRef target = 2;
  string context = 3; // pg_cast.castcontext: i (implicit), a (assignment)
  string method = 4; // pg_cast.castmethod: f (function), b (binary), i (I/O)
  QualifiedName function = 5; // absent for binary and I/O casts
}

// Catalog is the whole database snapshot: the single contract between the
// host and output plugins. Two producers build it: the catalog builder from
// schema files (desired state) and introspection from a live database
// (actual state).
message Catalog {
  string name = 1;              // database name
  string database_version = 2;  // PostgreSQL major the shape is for, e.g. "18"
  string default_schema = 3;    // usually "public"
  repeated string search_path = 4;
  repeated Extension extensions = 5;  // database-wide, ordered by object id
  repeated Schema schemas = 6;         // ordered by object id
  repeated Relation relations = 7;     // spanning all schemas, ordered by object id
  Metadata meta = 8;
  repeated Diagnostic diagnostics = 9; // source-ordered annotation warnings
}
